x-coverage:
  state: gated
  reason: contracts_behind_authentication
  detail: >-
    UC Berkeley operates a real, centrally governed API program with a publicly readable
    catalog of roughly 28 campus APIs, but every contract in it is behind CalNet SSO plus
    Data Owner approval. developers.api.berkeley.edu/apis returns 200 to an anonymous
    client and lists every API's name, description, data classification and owning
    organization; no API's interactive documentation or OpenAPI definition is reachable
    without a CalNet identity. This profile therefore holds no OpenAPI, no JSON Schema and
    no examples, and none were generated, because generating them would credit Berkeley
    with contracts it has not published. Three institution-operated machine-readable
    surfaces WERE found and verified by protocol response rather than by link presence:
    the CalNet Shibboleth/SAML IdP metadata, the library's GeoBlacklight JSON catalog, and
    the MyBRC research-computing API (401 JSON). Two repository surfaces were found and
    are recorded as TENANT rather than as Berkeley contracts. Berkeleytime
    (berkeleytime.com), the well-known student-built Berkeley course-data API, was probed
    and is live behind a Cloudflare challenge, but it runs on a non-institution domain
    under the ASUC student association and no evidence of University endorsement or
    operation was found, so it is deliberately NOT credited to Berkeley here.
  generated: '2026-08-19'
