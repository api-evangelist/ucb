aid: ucb
name: University of California, Berkeley
x-type: university
x-category: Public Research University
description: >-
  The University of California, Berkeley is a public land-grant research university and
  the founding campus of the University of California system. Berkeley is one of the few
  universities in this cohort that genuinely operates its own API program rather than
  merely appearing to: Berkeley IT's Engineering and Integration Services team runs an
  API Central developer portal and a shared API Gateway on Berkeley's own infrastructure,
  publishing a public catalog of roughly 28 campus APIs across Student Information, HR,
  finance and identity, each listed with its UC data classification (P1/P2/P3) and a named
  Data Owner. That program is real, but it is internal-first: the catalog is public and the
  contracts are not. No OpenAPI definition is retrievable without a CalNet identity and
  Data Owner approval, so this profile holds ZERO OpenAPI documents and that is the
  accurate measurement, not a gap in the research. What Berkeley does publish without
  credentials is narrower and mostly overlooked: a complete Shibboleth/SAML 2.0 identity
  provider metadata document at shib.berkeley.edu (InCommon entity
  urn:mace:incommon:berkeley.edu), a live GeoBlacklight JSON catalog of 5,156 geospatial
  datasets at geodata.lib.berkeley.edu, and a gated but well-formed research-computing API
  for the Savio cluster's access management system. Its research repositories are not its
  engineering: the Digital Collections OAI-PMH endpoint runs on TIND, and eScholarship is a
  California Digital Library service for the entire UC system. Both are recorded here as
  tenant relationships, not as Berkeley contracts.
