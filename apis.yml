apis:
  - aid: ucb:api-central
    name: API Central (Developer Portal)
    x-operator: institution
    description: >-
      Berkeley IT's centralized API management developer portal, operated by the
      Engineering and Integration Services (EIS) team. The catalog itself is public: an
      anonymous client can read all roughly 28 published campus APIs grouped by category
      (Student Information, UCB Administration, API and Integration Tools) and by Data
      Owner (SIS, UCB Human Resources, Berkeley Financial System, CalNet Identity and
      Access Management, and others), with each API's description, its UC data
      classification rating and its owning organization's contact address. Interactive
      OpenAPI documentation, access plans and credentials all require CalNet login and
      Data Owner approval, so no contract document is publicly retrievable.
    humanURL: https://developers.api.berkeley.edu/
    baseURL: https://developers.api.berkeley.edu/
    tags: [ API Management, Developer Portal, API Catalog, Authentication ]
    properties:
      - type: APIReference
        url: https://developers.api.berkeley.edu/apis
      - type: Documentation
        url: https://integration-services.berkeley.edu/api-management/developer-portal-api-central
      - type: TermsOfService
        url: https://developers.api.berkeley.edu/terms_of_service
      - type: Support
        url: https://developers.api.berkeley.edu/contact_us
      - type: Authentication
        url: authentication/ucb-authentication.yml

  - aid: ucb:api-gateway
    name: UC Berkeley API Gateway
    x-operator: institution
    description: >-
      The single centralized entry point for API requests across the Berkeley campus,
      operated by Berkeley IT on Berkeley's own CloudFront distribution. The gateway
      obfuscates the internal workings and physical host of each source system from
      clients and centralizes load balancing, authentication, authorization and rate
      limiting. Individual endpoints are discovered through API Central; the gateway root
      serves an explanatory page rather than a machine-readable index.
    humanURL: https://integration-services.berkeley.edu/api-management/api-gateway
    baseURL: https://gateway.api.berkeley.edu/
    tags: [ API Gateway, Authentication, Rate Limiting ]
    properties:
      - type: Documentation
        url: https://integration-services.berkeley.edu/api-management/api-gateway
      - type: RateLimits
        url: rate-limits/ucb-rate-limits.yml

  - aid: ucb:calnet-shibboleth
    name: CalNet Shibboleth Identity Provider (SAML 2.0 Metadata)
    x-operator: institution
    description: >-
      UC Berkeley's Shibboleth identity provider, operated by IST-CalNet, publishes a
      complete unauthenticated SAML 2.0 metadata document describing how any service
      provider federates with the institution. The EntityDescriptor carries entityID
      urn:mace:incommon:berkeley.edu, a shibmd:Scope of berkeley.edu, an IDPSSODescriptor
      supporting Shibboleth 1.0, SAML 1.1 and SAML 2.0 with HTTP-POST, HTTP-Redirect and
      HTTP-POST-SimpleSign bindings, SingleLogoutService endpoints, and an
      AttributeAuthorityDescriptor exposing SAML1 and SAML2 SOAP AttributeQuery services.
      The signing certificate is issued to O=UC Berkeley, OU=IST-Calnet. Berkeley's entry
      is also served by InCommon's MDQ service as a signed entity, confirming active
      federation and eduGAIN reach. This is the most substantial machine-readable artifact
      the institution publishes to an anonymous caller.
    humanURL: https://calnet.berkeley.edu/
    baseURL: https://shib.berkeley.edu/idp/shibboleth
    tags: [ Identity Federation, SAML, Shibboleth, InCommon, Authentication ]
    properties:
      - type: IdentityFederation
        url: https://shib.berkeley.edu/idp/shibboleth
      - type: Documentation
        url: https://calnet.berkeley.edu/
      - type: Conformance
        url: conformance/ucb-education-standards-conformance.yml

  - aid: ucb:geodata
    name: UC Berkeley Library GeoData (GeoBlacklight) Catalog API
    x-operator: institution
    description: >-
      The UC Berkeley Library's GIS and map discovery application, built and hosted by the
      Library itself (the application source is public at BerkeleyLibrary/geodata and the
      host resolves inside Berkeley's own network to nginx-prod.lib.berkeley.edu). Its
      Blacklight JSON interface answers anonymous requests at /catalog.json with a
      paginated JSON:API-shaped response over 5,156 geospatial dataset records described in
      OpenGeoMetadata Aardvark fields. This is the only Berkeley-operated API that returns
      institutional data to a caller with no credentials at all. No OpenAPI is published
      for it and none was generated.
    humanURL: https://geodata.lib.berkeley.edu/
    baseURL: https://geodata.lib.berkeley.edu/catalog.json
    tags: [ Open Data, Geospatial Data, Library, Discovery, GeoBlacklight ]
    properties:
      - type: OpenData
        url: https://geodata.lib.berkeley.edu/
      - type: GitHub
        url: https://github.com/BerkeleyLibrary/geodata

  - aid: ucb:mybrc
    name: MyBRC Cluster Access Management API
    x-operator: institution
    description: >-
      Berkeley Research Computing's cluster access management system, which handles
      allocations, project membership and access requests for the Savio high-performance
      computing cluster. The host resolves to Berkeley's own address space and the API
      answers an unauthenticated request with a well-formed JSON 401 rather than a login
      redirect, which is what distinguishes it from a web application. No schema or
      interactive documentation is served publicly. This is the research-computing surface
      class that universities genuinely operate and rarely publish.
    humanURL: https://mybrc.brc.berkeley.edu/
    baseURL: https://mybrc.brc.berkeley.edu/api/
    tags: [ Research Computing, HPC, Allocations, Authentication ]
    properties:
      - type: ResearchComputing
        url: https://research-it.berkeley.edu/services-projects/high-performance-computing-savio
      - type: Documentation
        url: https://research-it.berkeley.edu/

  - aid: ucb:digicoll-oai
    name: UC Berkeley Digital Collections OAI-PMH (TIND tenant)
    x-operator: tenant
    x-vendor: TIND
    description: >-
      Berkeley's Digital Collections repository exposes a live OAI-PMH 2.0 interface,
      confirmed with an actual verb=Identify response reporting repositoryName "Digital
      Collections", repositoryIdentifier digicoll.lib.berkeley.edu and adminEmail
      digicoll@berkeley.edu, with named collection sets available via ListSets. The
      metadata, the collections and the administrative contact are Berkeley's; the software
      and the protocol implementation are not. digicoll.lib.berkeley.edu CNAMEs to
      berkeley.lb.service.tind.io, making this a Berkeley-specific tenancy on TIND's
      platform. Recorded as a tenant relationship: the repository is a real institutional
      fact and one of Berkeley's few programmable surfaces, but the contract belongs to
      TIND and is not saved under this institution.
    humanURL: https://digicoll.lib.berkeley.edu/
    baseURL: https://digicoll.lib.berkeley.edu/oai2d
    tags: [ Research Repository, Digital Collections, OAI-PMH, Library, TIND ]
    properties:
      - type: ResearchRepository
        url: https://digicoll.lib.berkeley.edu/oai2d?verb=Identify
      - type: GitHub
        url: https://github.com/BerkeleyLibrary/python-tind-client

  - aid: ucb:escholarship
    name: eScholarship Repository and OAI-PMH (California Digital Library tenant)
    x-operator: tenant
    x-vendor: California Digital Library (University of California)
    description: >-
      eScholarship is the University of California's open-access publishing platform and
      institutional repository, operated system-wide by the California Digital Library, not
      by the Berkeley campus. Its OAI-PMH interface is live and was confirmed with
      verb=Identify (repositoryIdentifier escholarship.org, adminEmail
      help@escholarship.org). ListSets returns a single set, "everything" -- there is no
      Berkeley-scoped OAI set, which is precisely why this cannot be attributed to Berkeley
      as its own contract. Berkeley scholarship is deposited into it and surfaced under the
      unit path /uc/ucb. Recorded as a tenant relationship on a sibling UC service.
    humanURL: https://help.escholarship.org/support/solutions/articles/9000223035-about-escholarship-apis
    baseURL: https://escholarship.org/oai
    tags: [ Research Repository, Open Access, OAI-PMH, Scholarly Communication ]
    properties:
      - type: ResearchRepository
        url: https://escholarship.org/oai?verb=Identify
      - type: Documentation
        url: https://help.escholarship.org/support/solutions/articles/9000133474-using-the-oai-pmh-interface

  - aid: ucb:library-search
    name: UC Library Search / Primo VE Discovery (Ex Libris tenant)
    x-operator: tenant
    x-vendor: Ex Libris (Clarivate)
    description: >-
      Library discovery for the Berkeley campus runs on Ex Libris Primo VE as part of the
      shared UC Library Search environment. search.library.berkeley.edu is a Berkeley-branded
      hostname that CNAMEs to berkeley.primo.exlibrisgroup.com and then to
      na07.primo.exlibrisgroup.com, with a Berkeley view code of 01UCS_BER:UCB. No
      Berkeley-operated Alma OAI provider exists -- probing the Alma OAI endpoint with the
      Berkeley view code returns "Institution code 01UCS_BER is invalid", confirming the
      institution is a view inside a UC-wide network zone rather than the operator of its
      own Alma instance. The Library does publish its own open-source Alma and Primo
      tooling on GitHub. Recorded as a tenant relationship; no vendor contract saved here.
    humanURL: https://search.library.berkeley.edu/discovery/search?vid=01UCS_BER:UCB
    tags: [ Library, Discovery, Primo, Alma, Metadata ]
    properties:
      - type: LibraryCatalog
        url: https://search.library.berkeley.edu/discovery/search?vid=01UCS_BER:UCB
      - type: GitHub
        url: https://github.com/BerkeleyLibrary/alma

