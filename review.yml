reviews:
  - date: '2026-08-19'
    rating: 4
    pipeline: university
    summary: >-
      Re-profiled under the API Evangelist university pipeline, which settles the operator
      axis before saving anything. The June 2026 profile was directionally right about
      Berkeley's API program but attributed two vendor-run repository surfaces to the
      institution without qualification. Corrected: every apis[] entry now carries an
      x-operator. Five surfaces are institution-operated and three are tenant
      relationships. Three institution-operated machine-readable surfaces were newly found
      and verified by protocol response rather than link presence -- the CalNet
      Shibboleth/SAML 2.0 IdP metadata at shib.berkeley.edu (entityID
      urn:mace:incommon:berkeley.edu, also served signed by InCommon MDQ), the Library's
      GeoBlacklight JSON catalog at geodata.lib.berkeley.edu returning 5,156 anonymous
      records, and the MyBRC Savio cluster access-management API answering a well-formed
      JSON 401. The API Central catalog was re-read anonymously with a browser User-Agent
      and returns 200, not the 403 recorded in June: roughly 28 campus APIs are publicly
      listed with data classifications and named Data Owners, while every contract stays
      CalNet-gated. eScholarship was reclassified from a Berkeley surface to a California
      Digital Library tenant relationship (its OAI-PMH exposes a single "everything" set;
      there is no Berkeley-scoped set). Digital Collections OAI-PMH was newly found on
      Berkeley's own hostname but CNAMEs to TIND, so it is recorded as tenant. The library
      Alma/Primo entry was reclassified as an Ex Libris tenant after the Alma OAI provider
      rejected the Berkeley view code 01UCS_BER as an invalid institution code. Zero
      OpenAPI documents are held and none were generated. Berkeleytime was probed, is live,
      and was deliberately not credited: student-run, non-institution domain, no evidence
      of University operation.
    endpoints:
