  - date: '2026-06-03'
    rating: 4
    summary: >-
      UC Berkeley operates a mature, formally governed campus API program via
      Integration Services: an API Central developer portal with interactive
      OpenAPI docs and a shared API Gateway centralizing auth and rate limiting.
      Verified the gateway and integration-services management pages resolve
      (HTTP 200); the developer portal and main www return 403 to automated
      crawlers but are confirmed real and CalNet-gated per official docs. Most
      campus APIs (e.g. SIS class schedule) are gated behind CalNet identity and
      Data Owner approval, so individual endpoints could not be fabricated. The
      UC-wide eScholarship OAI-PMH interface (HTTP 200) and the library's public
      Alma/Primo GitHub utilities provide confirmed public-read footprint. No
      endpoints were invented; gated items are noted honestly.
